<!-- ============================================================
     THINGS I KNOW — word cloud under the folder; click a word to
     see where the skill comes from
     ============================================================ -->
<section class="know" id="things-i-know" aria-labelledby="know-title">
  <div class="know-head">
    <h2 id="know-title">Namrata's Brain</h2>
    <p class="know-note">Click each topic to learn more</p>
  </div>
  <div class="know-cloud" id="know-cloud">
    <div class="sheet know-card" id="know-card" role="dialog" aria-live="polite" hidden>
      <button class="know-card-close" type="button" aria-label="Close">&times;</button>
      <span class="know-card-group"></span>
      <div class="know-card-title">
        <h3></h3>
        <span class="know-card-rating" hidden></span>
      </div>
      <p></p>
    </div>
  </div>
  <ul class="know-legend" aria-hidden="true">
    <li style="--c: var(--w-code)">Code</li>
    <li style="--c: var(--w-data)">Data</li>
    <li style="--c: var(--w-it)">IT &amp; systems</li>
    <li style="--c: var(--w-design)">Design &amp; engineering</li>
    <li style="--c: var(--w-people)">People</li>
    <li style="--c: var(--w-lang)">Languages</li>
  </ul>
</section>

<a class="more-hint" id="more-hint" href="#things-i-know">Scroll <i class="fas fa-arrow-down"></i></a>
