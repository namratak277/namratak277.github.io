<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="shortcut icon" href="favicon.ico">
  <script>
    (function(){var t=localStorage.getItem('theme');if(t!=='dark')document.documentElement.setAttribute('data-theme','light');})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/portfolio.css?v=20260723">
  <link rel="stylesheet" href="assets/css/folder.css?v=20261102">
</head>

<body>
  <!-- Shared nav stays loaded (hidden by folder.css) because portfolio.js
       owns the theme toggle that lives inside it -->
  <div id="nav-slot"></div>

  <!-- ============================================================
       FOLDER — tabs come from _data/tabs.yml; each tab is its own page
       ============================================================ -->
  <div class="folder-wrap" id="folder">
    <div class="folder-bar">
      <nav class="folder-tabs" aria-label="Portfolio sections">
        {%- for t in site.data.tabs %}
        <a class="folder-tab{% if t.id == 'cover' %} folder-tab-cover{% endif %}{% if t.leaves %} folder-tab-link{% endif %}" href="{{ t.url }}"{% if t.id == page.tab %} aria-current="page"{% endif %}{% if t.id == 'cover' %} aria-label="{{ t.label }}"{% endif %}>
          {%- if t.id == 'cover' %}
          <span class="nav-prompt">&gt;</span>
          <svg class="nav-monogram" width="16" height="16" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <line x1="3"  y1="4" x2="3"  y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="3"  y1="4" x2="15" y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="15" y1="4" x2="15" y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="15" y1="15" x2="27" y2="4"  stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="15" y1="15" x2="27" y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          </svg>
          <span class="nav-cursor">_</span>
          {%- else %}{{ t.label }}{% endif -%}
        </a>
        {%- endfor %}
      </nav>
      <button class="theme-toggle folder-theme" id="folder-theme" type="button" aria-label="Toggle light/dark mode"><i class="fas fa-moon"></i></button>
    </div>
    <div class="folder-body">
{{ content }}
    </div>
  </div>

  {% include brain.html %}

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <a class="footer-logo" href="index.html" aria-label="Home">
          <span class="nav-prompt">&gt;</span>
          <svg class="nav-monogram" width="19" height="19" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <line x1="3"  y1="4" x2="3"  y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="3"  y1="4" x2="15" y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="15" y1="4" x2="15" y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="15" y1="15" x2="27" y2="4"  stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="15" y1="15" x2="27" y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          </svg>
          <span class="nav-cursor">_</span>
        </a>
        <div class="footer-socials">
          <a href="https://linkedin.com/in/namrata-karki" target="_blank"><i class="fab fa-linkedin-in"></i></a>
          <a href="https://github.com/namratak277" target="_blank"><i class="fab fa-github"></i></a>
          <a href="mailto:namratak277@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="assets/js/portfolio.js?v=20260723"></script>
  <script src="assets/js/folder.js?v=20261102"></script>
  <script src="assets/js/brain.js?v=20261102"></script>
</body>
</html>
